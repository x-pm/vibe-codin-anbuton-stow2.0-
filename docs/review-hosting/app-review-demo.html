<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>俺不囤 — App Review Screen Recording</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f3f4f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
        text-align: center;
      }
      p {
        margin: 0 0 20px;
        color: #9ca3af;
        font-size: 0.95rem;
        text-align: center;
        max-width: 640px;
        line-height: 1.5;
      }
      .player {
        width: min(100%, 720px);
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      video {
        display: block;
        width: 100%;
        max-height: 80vh;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>俺不囤 — Screen Recording for App Review</h1>
    <p>
      Guideline 2.1 demo: launch → core flows (entry, inventory, plans) → sign-in → account deletion.
      Open this page to play the recording.
      <br />
      App Store:
      <a href="https://apps.apple.com/cn/app/%E4%BF%BA%E4%B8%8D%E5%9B%A4/id6802397132" style="color:#93c5fd">俺不囤</a>
    </p>
    <div class="player">
      <!-- 把录屏文件放到同目录，文件名改成你的实际文件名 -->
      <video controls playsinline preload="metadata" poster="">
        <source src="./app-review-demo.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>
    </div>
  </body>
</html>
